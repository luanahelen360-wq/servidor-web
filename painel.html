
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Meu Servidor Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="container navegacao">
            <a href="index.html" class="logo">
                <span>WEB</span> SERVER
            </a>
            <nav>
                <a href="index.html">Início</a>
                <a href="#" onclick="sair()">Sair</a>
            </nav>
        </div>
    </header>

    <main class="secao">
        <div class="container">

            <h2 id="boasVindas">Bem-vindo!</h2>

            <div class="cartao">
                <h3>Seu painel</h3>
                <p>Você entrou no sistema com sucesso!</p>
                <p>Esta é sua área de usuário.</p>

                <hr>

                <h3>Dados da conta</h3>

                <p id="nomeUsuario"></p>
                <p id="emailUsuario"></p>
                <p id="dataAcesso"></p>

                <button onclick="sair()">Sair da conta</button>
            </div>

        </div>
    </main>

    <script>
        const nome = sessionStorage.getItem("usuarioLogado");
        const email = sessionStorage.getItem("emailLogado");
        const data = sessionStorage.getItem("dataAcesso");

        if (!nome) {
            window.location.href = "./login.html";
        } else {
            document.getElementById("boasVindas").textContent =
                "Bem-vindo(a), " + nome + "!";

            document.getElementById("nomeUsuario").textContent =
                "Nome: " + nome;

            document.getElementById("emailUsuario").textContent =
                "E-mail: " + (email || "Não informado");

            document.getElementById("dataAcesso").textContent =
                "Data de acesso: " + (data || "Não informada");
        }

        function sair() {
            sessionStorage.clear();
            window.location.href = "./login.html";
        }
    </script>

</body>
</html>
