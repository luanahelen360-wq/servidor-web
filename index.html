
<!-- MEDIDOR DE VELOCIDADE DA INTERNET -->
<section class="secao medidor-secao" id="medidor">

    <div class="container">

        <div class="medidor-titulo">
            <h2>Medidor de Velocidade da Internet</h2>
            <p>Demonstração interativa de velocidade de conexão.</p>
        </div>

        <div class="medidor-painel">

            <div class="velocimetro" id="velocimetro">

                <div class="velocimetro-valor">
                    <strong id="velocidade">0</strong>
                    <span>Mbps</span>
                </div>

                <div class="ponteiro"></div>

            </div>

            <p class="medidor-status" id="statusTeste">
                Pronto para iniciar
            </p>

            <button
                type="button"
                id="botaoTeste"
                class="botao-medidor"
                onclick="iniciarTeste()">
                Iniciar teste
            </button>

            <div class="medidor-resultados">

                <div class="resultado">
                    <span>Download</span>
                    <strong id="download">0 Mbps</strong>
                </div>

                <div class="resultado">
                    <span>Upload</span>
                    <strong id="upload">0 Mbps</strong>
                </div>

                <div class="resultado">
                    <span>Ping</span>
                    <strong id="ping">0 ms</strong>
                </div>

            </div>

            <p class="medidor-aviso">
                Valores simulados para fins ilustrativos.
            </p>

        </div>

    </div>

</section>
